[project]
name = "rag-research-graph"
version = "0.0.1"
description = "Starter template for making a custom RAG research agent graph in LangGraph."
authors = [
    { name = "Vadym Barda", email = "19161700+vbarda@users.noreply.github.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "langgraph>=1.2,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "python-dotenv>=1.0.1",
    "msgspec>=0.18.6",
    "langchain-cohere>=0.4",
    "langgraph-cli[inmem]>=0.4.3",
    "langchain-deepseek>=0.1.4",
    "dashscope>=1.27.2",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "pymilvus>=3.0.0",
    "jieba>=0.42.1",
    "nltk>=3.9.1",
    "psycopg[binary]>=3.2",
    "langmem>=0.0.30",
    "milvus-model>=0.2.12",
    "ragas>=0.0.22",
    "langchain-community==0.4.1",
    "rapidfuzz>=3.14.5",
    "semantic-router>=0.1.16,<1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retrieval_graph", "shared"]
[tool.setuptools.package-dir]
"langgraph.templates.retrieval_graph" = "src/retrieval_graph"
"retrieval_graph" = "src/retrieval_graph"
"shared" = "src/shared"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.mypy]
# 第三方库缺少类型存根的模块统一在此忽略，避免逐处 # type: ignore
[[tool.mypy.overrides]]
module = [
    "jieba",
    "pymilvus",
    "milvus_model.*",
    "langmem.*",
]
ignore_missing_imports = true

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
    # Chinese docstrings use "。" which pydocstyle does not recognize as closing punctuation.
    "D415",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
# 索引脚本是命令行工具，进度输出依赖 print
"scripts/*" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.pytest.ini_options]
pythonpath = [
  "src"
]
